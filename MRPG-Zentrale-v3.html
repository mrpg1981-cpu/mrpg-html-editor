<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MRPG Zentrale v3</title>
<style>
:root{--bg:#2b2f36;--panel:#383c44;--panel2:#24272d;--line:#59616d;--cyan:#67f5ff;--green:#3fb950;--red:#f85149;--text:#f2f5f7;--muted:#b9bec7;--code:Consolas,monospace}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{height:100%;display:grid;grid-template-rows:52px 1fr 28px}.top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel2);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:9px;color:var(--cyan);font-weight:800;font-family:var(--code)}.logo{width:34px;height:34px;border:1px solid var(--cyan);border-radius:8px;display:grid;place-items:center;color:var(--cyan);font-family:var(--code);box-shadow:0 0 12px #67f5ff44}.spacer{flex:1}.btn{padding:7px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text)}.btn:hover{color:var(--cyan);border-color:var(--cyan)}.primary{background:var(--cyan);color:#101418;border-color:var(--cyan);font-weight:700}.layout{min-height:0;display:grid;grid-template-columns:220px 1fr 42%}.side,.editor,.right{min-width:0;min-height:0;background:var(--panel2);border-right:1px solid var(--line)}.side{display:flex;flex-direction:column}.side h3,.bar{padding:11px 13px;margin:0;color:var(--muted);font-size:12px;text-transform:uppercase;border-bottom:1px solid var(--line)}.files{padding:8px;overflow:auto}.file{width:100%;padding:8px;border:0;background:transparent;color:var(--muted);text-align:left;font-family:var(--code);font-size:12px;border-radius:5px}.file:hover,.file.active{background:#67f5ff22;color:var(--cyan)}.sidefoot{margin-top:auto;padding:10px;border-top:1px solid var(--line);display:grid;gap:7px}.editor{display:flex;flex-direction:column}.tabs{height:37px;display:flex;overflow:auto;border-bottom:1px solid var(--line);background:var(--panel2)}.tab{border:0;border-top:2px solid transparent;background:transparent;color:var(--muted);padding:0 12px;white-space:nowrap}.tab.active{color:var(--text);border-top-color:var(--cyan);background:var(--bg)}#code{width:100%;height:100%;resize:none;border:0;outline:0;background:#292d34;color:var(--text);padding:16px;font:14px/1.55 var(--code);tab-size:2}.editorbody{flex:1;min-height:0}.meta,.status{font:11px var(--code);color:var(--muted);padding:6px 10px;border-top:1px solid var(--line)}.right{display:flex;flex-direction:column;border-right:0}.righttabs{display:flex;border-bottom:1px solid var(--line)}.righttabs button{flex:1;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:10px}.righttabs button.active{color:var(--cyan);border-color:var(--cyan)}.view{display:none;flex:1;min-height:0}.view.active{display:flex;flex-direction:column}.tools{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-bottom:1px solid var(--line)}#preview{flex:1;width:100%;height:100%;border:0;background:#fff}.previewbox{flex:1;min-height:0;background:#444b55;display:flex;justify-content:center;overflow:auto}#console,#terminal{flex:1;overflow:auto;padding:12px;background:#171a1f;color:var(--green);font:12px/1.5 var(--code);white-space:pre-wrap}.termline{display:flex;gap:8px;padding:9px;border-top:1px solid var(--line);background:var(--panel2)}#term{flex:1;border:0;outline:0;background:transparent;color:var(--text);font:13px var(--code)}.metric{padding:10px;margin:10px;border:1px solid var(--line);border-radius:6px}.metric b{color:var(--cyan)}dialog{background:var(--panel);color:var(--text);border:1px solid var(--cyan);border-radius:8px;padding:20px;min-width:320px}dialog::backdrop{background:#000b}dialog input,dialog select{width:100%;padding:8px;margin:6px 0 12px;background:var(--panel2);border:1px solid var(--line);color:var(--cyan)}@media(max-width:900px){.layout{grid-template-columns:1fr 1fr}.side{display:none}}@media(max-width:650px){.layout{grid-template-columns:1fr}.right{display:none}.right.mobile{display:flex;position:fixed;inset:52px 0 28px;z-index:5}.hideMobile{display:none}}
</style>
</head>
<body><div class="app">
<header class="top"><button class="btn" id="sideBtn">☰</button><div class="brand"><span class="logo">M</span><span>MRPG Zentrale<br><small>Techcare Services · v3</small></span></div><div class="spacer"></div><button class="btn" id="terminalBtn">⌨ Terminal</button><button class="btn" id="settingsBtn">⚙ Einstellungen</button><button class="btn primary" id="downloadBtn">⬇ HTML herunterladen</button></header>
<main class="layout"><aside class="side" id="side"><h3>Projekt-Dateien <button class="btn" id="newBtn">＋</button></h3><div class="files" id="files"></div><div class="sidefoot"><button class="btn" id="importBtn">⇧ Import</button><button class="btn" id="exportBtn">⬇ Projekt JSON</button><small id="storage"></small></div></aside>
<section class="editor"><div class="tabs" id="tabs"></div><div class="editorbody"><textarea id="code" spellcheck="false"></textarea></div><div class="meta"><span id="active">index.html</span> · <span id="stats">0 Zeilen · 0 Zeichen</span></div></section>
<section class="right" id="right"><nav class="righttabs"><button class="active" data-view="previewView">Preview</button><button data-view="consoleView">Console</button><button data-view="blueprintView">Blueprint</button></nav><section class="view active" id="previewView"><div class="tools"><button class="btn" id="refresh">⟳</button><button class="btn" data-width="100%">Desktop</button><button class="btn" data-width="768px">Tablet</button><button class="btn" data-width="390px">Mobile</button><button class="btn" id="dark">☾</button></div><div class="previewbox"><iframe id="preview" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe></div></section><section class="view" id="consoleView"><div id="console"></div></section><section class="view" id="blueprintView"><div class="metric"><b>MRPG Zentrale v3</b><br>Local-first Control Room</div><div class="metric" id="blueprint"></div></section></section></main>
<section id="terminal" style="display:none"><div id="terminalOut">MRPG Terminal v3 · help für Befehle\n</div><div class="termline"><span>mrpg@zentrale:~$</span><input id="term" autocomplete="off"></div></section><footer class="status"><span id="state">READY</span><span class="spacer"></span>LOCAL-FIRST · Ctrl+K Palette</footer></div>
<input id="importFile" type="file" accept=".html,.css,.js,.md,.json" hidden>
<dialog id="settings"><h3 style="color:var(--cyan)">⚙ Einstellungen</h3><label>Theme</label><select id="theme"><option value="gray">Gray</option><option value="cyber">Cyber Dark</option></select><label><input type="checkbox" id="wrap"> Zeilenumbruch</label><label>Schriftgröße</label><select id="font"><option>12</option><option selected>14</option><option>16</option><option>18</option></select><br><button class="btn primary" id="saveSettings">Speichern</button> <button class="btn" onclick="settings.close()">Schließen</button></dialog>
<script>
(()=>{'use strict';const KEY='mrpg-zentrale-v3-project',SET='mrpg-zentrale-v3-settings',DEFAULT='<!doctype html>\n<html lang="de"><head><meta charset="utf-8"><title>MRPG Demo</title><style>body{font-family:system-ui;background:#f4f6f8;color:#20242a;padding:48px}.card{max-width:600px;margin:auto;background:white;padding:32px;border-radius:12px;border:2px solid #00b8cc}button{padding:10px 16px;background:#00b8cc;color:white;border:0;border-radius:6px}</style></head><body><main class="card"><h1>MRPG Zentrale v3</h1><p>Bearbeite den Code links.</p><button onclick="console.log(\'MrPG OK\')">Test</button></main></body></html>', $=id=>document.getElementById(id);let files=JSON.parse(localStorage.getItem(KEY)||'null')||{'index.html':DEFAULT,'README.md':'# MRPG Zentrale v3'},active='index.html',history=[],hi=-1;
function save(){localStorage.setItem(KEY,JSON.stringify(files));$('state').textContent='GESPEICHERT'}function current(){return files[active]||''}function render(){let f=$('files');f.innerHTML=Object.keys(files).map(x=>'<button class="file '+(x===active?'active':'')+'" data-file="'+x+'">'+x+'</button>').join('');$('tabs').innerHTML=Object.keys(files).map(x=>'<button class="tab '+(x===active?'active':'')+'" data-file="'+x+'">'+x+'</button>').join('');$('storage').textContent=Object.keys(files).length+' Dateien';$('blueprint').innerHTML='<b>Dateien:</b> '+Object.keys(files).length+'<br><b>Aktiv:</b> '+active}function openFile(n){if(!(n in files))return;active=n;$('code').value=files[n];render();update();refresh()}function update(){let v=$('code').value;$('active').textContent=active;$('stats').textContent=v.split('\n').length+' Zeilen · '+v.length+' Zeichen'}function refresh(){let h=files['index.html']||$('code').value;$('preview').srcdoc=h; $('state').textContent='PREVIEW SYNCED'}function download(n,c){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/html;charset=utf-8'}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('code').addEventListener('input',()=>{files[active]=$('code').value;update();save();refresh()});document.addEventListener('click',e=>{let n=e.target.dataset.file;if(n)openFile(n)});$('downloadBtn').onclick=()=>download(active, current());$('refresh').onclick=refresh;document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{$('preview').style.width=b.dataset.width});$('dark').onclick=()=>$('preview').classList.toggle('dark');$('sideBtn').onclick=()=>$('side').classList.toggle('hidden');$('terminalBtn').onclick=()=>{let x=$('terminal');x.style.display=x.style.display==='none'?'flex':'none';if(x.style.display==='flex'){$('right').classList.remove('mobile');$('term').focus()}};$('right').querySelectorAll('.righttabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.righttabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.view).classList.add('active')});$('newBtn').onclick=()=>{let n=prompt('Dateiname');if(n&&!files[n]){files[n]='';save();openFile(n)}};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let f=e.target.files[0];if(f){files[f.name]=await f.text();save();openFile(f.name)}};$('exportBtn').onclick=()=>download('mrpg-projekt.json',JSON.stringify(files,null,2));
$('settingsBtn').onclick=()=>{$('settings').showModal();let s=JSON.parse(localStorage.getItem(SET)||'{}');$('theme').value=s.theme||'gray';$('wrap').checked=!!s.wrap;$('font').value=s.font||14};$('saveSettings').onclick=()=>{let s={theme:$('theme').value,wrap:$('wrap').checked,font:+$('font').value};localStorage.setItem(SET,JSON.stringify(s));document.body.className=s.theme==='cyber'?'theme-cyber':'theme-gray';$('code').style.fontSize=s.font+'px';$('code').style.whiteSpace=s.wrap?'pre-wrap':'pre';$('settings').close()};
function out(x){$('terminalOut').textContent+=x+'\n';$('terminalOut').scrollTop=1e9}$('term').onkeydown=e=>{if(e.key!=='Enter')return;let line=e.target.value.trim();out('mrpg@zentrale:~$ '+line);let a=line.split(/\s+/),c=a.shift();if(c==='help')out('help, ls, open <datei>, save, download, preview, stats, clear, theme');else if(c==='ls')out(Object.keys(files).join('\n'));else if(c==='open')openFile(a[0]);else if(c==='save')save();else if(c==='download')download(active,current());else if(c==='preview')refresh();else if(c==='stats')out(current().split('\n').length+' Zeilen · '+current().length+' Zeichen');else if(c==='clear')$('terminalOut').textContent='';else if(c==='theme'){$('settingsBtn').click();}else if(c==='echo')out(a.join(' '));else out('Unbekannter Befehl – help');e.target.value=''};
render();openFile(active);$('settings').addEventListener('close',()=>{});})();
</script></body></html>
